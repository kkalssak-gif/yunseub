<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 인덱스</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 40px;
            background-color: #f6f8fa;
            color: #24292e;
        }
        h1 {
            border-bottom: 1px solid #eaecef;
            padding-bottom: 10px;
        }
        .folder {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .folder-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            margin-bottom: 10px;
        }
        a {
            color: #0366d6;
            text-decoration: none;
            font-size: 16px;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>웹 프로젝트 목록</h1>

    <div class="folder">
        <div class="folder-title">📁 Project 1</div>
        <ul>
            <li><a href="project1/one.html">📄 one.html 보기</a></li>
            <li><a href="project1/two.html">📄 two.html 보기</a></li>
        </ul>
    </div>

    <div class="folder">
        <div class="folder-title">📁 Project 2</div>
        <ul>
            <li><a href="project2/three.html">📄 three.html 보기</a></li>
            <li><a href="project2/four.html">📄 four.html 보기</a></li>
        </ul>
    </div>

</body>
</html>
